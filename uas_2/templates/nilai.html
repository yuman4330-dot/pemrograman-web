<!DOCTYPE html>
<html>
<head>
    <title>Input Nilai</title>
</head>
<body>

<div class="container">
<h2>Input Nilai</h2>

{% if tahap == "jumlah" %}
<form method="post">
  Jumlah Mata Kuliah:
  <input type="number" name="jumlah" min="1" required>
  <br><br>
  <button type="submit">Lanjut</button>
</form>

{% elif tahap == "input" %}
<form method="post">
  Nilai ke-{{ index }}:
  <input type="number" step="0.1" name="nilai" required>
  <br><br>
  <button type="submit">Simpan</button>
</form>
{% endif %}

<br>
<a href="/">⬅ Kembali ke Menu</a>
</body>
</html>
